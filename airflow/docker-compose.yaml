services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:3.1.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    command:
      - bash
      - -c
      - |
        airflow db migrate
    restart: "no"

  airflow-webserver:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
      - .:/opt/airflow
      - ../retail_sales_dbt:/opt/dbt/retail_sales_dbt
      - ../scripts:/opt/scripts
      - ../data:/opt/data
      - C:/Users/telap/.dbt:/home/airflow/.dbt
      - C:/Users/telap/.aws:/home/airflow/.aws
    command: api-server

  airflow-scheduler:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__INTERNAL_API_URL: http://airflow-webserver:8080
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
    volumes:
      - .:/opt/airflow
      - ../retail_sales_dbt:/opt/dbt/retail_sales_dbt
      - ../scripts:/opt/scripts
      - ../data:/opt/data
      - C:/Users/telap/.dbt:/home/airflow/.dbt
      - C:/Users/telap/.aws:/home/airflow/.aws
    command: scheduler

  airflow-dag-processor:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
      - .:/opt/airflow
      - ../retail_sales_dbt:/opt/dbt/retail_sales_dbt
      - ../scripts:/opt/scripts
      - ../data:/opt/data
      - C:/Users/telap/.dbt:/home/airflow/.dbt
      - C:/Users/telap/.aws:/home/airflow/.aws
    command: dag-processor

volumes:
  postgres-db-volume:
